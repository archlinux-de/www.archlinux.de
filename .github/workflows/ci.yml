name: CI

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
              with:
                persist-credentials: false
            - name: Run Common Setup
              uses: ./.github/actions/setup
            - name: Resolve golangci-lint version
              id: golangci-lint-version
              run: |
                  echo "version=$(go list -m -f '{{.Version}}' github.com/golangci/golangci-lint/v2@latest)" >> "$GITHUB_OUTPUT"
                  echo "go-version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
            - name: Cache golangci-lint
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
              with:
                  path: ~/go/bin/golangci-lint
                  key: golangci-lint-${{ runner.os }}-${{ steps.golangci-lint-version.outputs.go-version }}-${{ steps.golangci-lint-version.outputs.version }}
            - name: Install golangci-lint
              run: test -x ~/go/bin/golangci-lint || go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ steps.golangci-lint-version.outputs.version }}
            - name: Build Templates
              run: just build-templates
            - name: Run Linter
              run: just lint

    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
              with:
                persist-credentials: false
            - name: Run Common Setup
              uses: ./.github/actions/setup
            - name: Build Templates
              run: just build-templates
            - name: Run Tests
              run: just test

    build:
        runs-on: ubuntu-latest
        needs: [lint, test]
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
              with:
                persist-credentials: falsey
            - name: Run Common Setup
              uses: ./.github/actions/setup
            - name: Build Application
              run: just build
            - name: Upload binary
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
              # TODO: remove go branch condition once merged into main
              if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/go'
              with:
                  name: archded
                  path: archded
                  retention-days: 7

    deploy:
        runs-on: ubuntu-latest
        needs: [build]
        # TODO: remove go branch condition once merged into main
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/go'
        steps:
            - name: Download binary
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
              with:
                  name: archded
            - name: Deploy
              env:
                  SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
                  KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
                  DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
                  DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
              run: |
                  mkdir -p ~/.ssh
                  echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
                  echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
                  chmod 600 ~/.ssh/id_ed25519
                  chmod +x archded
                  rsync -e "ssh -p ${DEPLOY_SSH_PORT}" archded archded@${DEPLOY_HOST}:/opt/archded/archded.new
                  ssh -p "${DEPLOY_SSH_PORT}" archded@${DEPLOY_HOST} "mv /opt/archded/archded.new /opt/archded/archded"
